services:
  sovereignstream-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "1935:1935"
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./hls:/app/hls
    environment:
      - SOVEREIGNSTREAM_HTTP_ADDR=:8080
      - SOVEREIGNSTREAM_RTMP_ADDR=:1935
      - SOVEREIGNSTREAM_DASHBOARD_ADDR=:3000
      - SOVEREIGNSTREAM_DB_PATH=/app/data/sovereignstream.db
      - SOVEREIGNSTREAM_HLS_DIR=/app/hls
